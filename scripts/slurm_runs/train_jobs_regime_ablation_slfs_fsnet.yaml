# SLFS/FSNet regime-weight ablation: W1–W3 suffixed training HDF5 × grids 13/123/240.
#
# W0 baseline (not re-trained): <case>_training.h5 under results/slfs_fsnet/.
#
# Generate (from repository root):
#   python scripts/slurm_runs/train_jobs.py generate --config scripts/slurm_runs/train_jobs_regime_ablation_slfs_fsnet.yaml --check-train-h5
# Submit (both resource groups for full grid parallelism):
#   sbatch scripts/slurm_runs/slfs_fsnet_regime_ablation/submit_small.sh
#   sbatch scripts/slurm_runs/slfs_fsnet_regime_ablation/submit_medium.sh

name: slfs_fsnet_regime_ablation

matrix:
  methods: [slfs_fsnet_wd1]
  grids: ["13", "123", "240"]
  seeds: [1]
  train_variants:
    - suffix: "060_005_035"
    - suffix: "060_035_005"
    - suffix: "060_020_020"
    - suffix: "l02_u08"

results_dir: results/slfs_fsnet_regime_ablation
max_parallel: 20
group_by_resource: true
overwrite: true

env:
  conda_env: new_opt

slurm:
  job_name: train_slfs_regime_ablation
  log_dir: logs/training/regime_ablation_slfs
  default_resource_profile: medium

resources:
  small:
    time: "12:00:00"
    mem: 32G
    cpus_per_task: 4
    gpus: 1
    gpu_type: h200
    partition: pi_donti_gpu,mit_preemptable
  medium:
    time: "24:00:00"
    mem: 64G
    cpus_per_task: 8
    gpus: 1
    gpu_type: h200
    partition: pi_donti_gpu,mit_preemptable
  large:
    time: "47:50:00"
    mem: 200G
    cpus_per_task: 4
    gpus: 1
    gpu_type: h200
    partition: pi_donti_gpu

x-slfs-fsnet-args: &slfs_fsnet_args
  lin_steps: 2
  diff_steps: 1
  fs_maxiter: 50
  fs_tol: 1.0e-6
  fs_rho: 0.0
  test_lin_steps: 2
  test_fs_tol: 1.0e-6
  test_fs_maxiter: 100
  test_voltage_weight: 1.0
  save_every: 5
  log_every: 1
  woodbury_ir_steps: "auto"
  woodbury_batch_mode: "vmap"

method_profiles:
  slfs_fsnet_wd1:
    entrypoint: methods/slfs_fsnet/train.py
    case_suffix: fsnet_wd1
    ablation_case_token: fsnet
    args:
      <<: *slfs_fsnet_args
      weight_dist: 1.0

grid_profiles:
  "13":
    case_dir: IEEE13Nodeckt
    resource_profile: small
    epochs: 10
    num_layers: 4
    learning_rate: 1.0e-4
    batch_size: 32
    hidden_size: 512
    power_flow_solver: fixed_point
    train_samples: 200000
    eval_samples: 2000
    test_samples: 2000
    val_h5: datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_feasible.h5
    test_variants:
      - datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_feasible.h5
      - datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_infeasible.h5
      - datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_feasible_high_load_low_der.h5
      - datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_feasible_low_load_high_der.h5

  "123":
    case_dir: IEEE123Master
    resource_profile: small
    epochs: 5
    num_layers: 4
    learning_rate: 1.0e-4
    batch_size: 8
    hidden_size: 1024
    power_flow_solver: fixed_point
    train_samples: 200000
    eval_samples: 2000
    test_samples: 2000
    val_h5: datagen_topo/datasets/IEEE123Master/IEEE123Master_test_feasible.h5
    test_variants:
      - datagen_topo/datasets/IEEE123Master/IEEE123Master_test_feasible.h5
      - datagen_topo/datasets/IEEE123Master/IEEE123Master_test_infeasible.h5
      - datagen_topo/datasets/IEEE123Master/IEEE123Master_test_feasible_low_load_high_der.h5
      - datagen_topo/datasets/IEEE123Master/IEEE123Master_test_feasible_high_load_low_der.h5

  "240":
    case_dir: 240bus_Master
    resource_profile: medium
    epochs: 5
    num_layers: 4
    learning_rate: 1.0e-4
    batch_size: 32
    hidden_size: 1024
    power_flow_solver: newton_gmres
    train_samples: 200000
    eval_samples: 2000
    test_samples: 2000
    val_h5: datagen_topo/datasets/240bus_Master/240bus_Master_test_feasible.h5
    test_variants:
      - datagen_topo/datasets/240bus_Master/240bus_Master_test_feasible.h5
      - datagen_topo/datasets/240bus_Master/240bus_Master_test_infeasible.h5
      - datagen_topo/datasets/240bus_Master/240bus_Master_test_feasible_high_load_low_der.h5
      - datagen_topo/datasets/240bus_Master/240bus_Master_test_feasible_low_load_high_der.h5
