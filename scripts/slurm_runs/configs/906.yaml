# 906-bus feeder. Schema: see 13.yaml.

case_dir: 906bus_Master
seed: [1, 2, 3]   # one Slurm array task per seed

slurm:
  time: "23:00:00"
  mem: 64G
  partition: pi_donti_gpu,pi_donti_gpu_preemptable,mit_preemptable

args:
  num_layers: 4
  hidden_size: 1024
  learning_rate: 5.0e-5
  batch_size: 32
  power_flow_solver: fixed_point
  train_samples: 200000
  eval_samples: 2000
  test_samples: 2000

method_args:
  penalty_pf:
    epochs: 5
  penalty_direct:
    epochs: 20

val_set: feasible_validation   # no validation set for this grid yet: test set

test_sets:
  core: [feasible, feasible_high_load_low_der, feasible_low_load_high_der]
  full: [feasible, feasible_high_load_low_der, feasible_low_load_high_der,
         feasible_shifted_m01_std01, feasible_shifted_m02_std02, feasible_shifted_m03_std03,
         feasible_shifted_m04_std04, feasible_shifted_m05_std05, feasible_oor_load]
