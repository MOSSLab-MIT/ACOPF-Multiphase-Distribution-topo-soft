# IEEE 8500-node feeder. Schema: see 13.yaml.

case_dir: 8500_Master
seed: [1, 2, 3]   # one Slurm array task per seed

slurm:
  time: "47:50:00"
  mem: 200G
  partition: pi_donti_gpu,pi_donti_gpu_preemptable,mit_preemptable

args:
  num_layers: 4
  hidden_size: 2048
  learning_rate: 5.0e-6
  batch_size: 4
  power_flow_solver: fixed_point
  train_samples: 200000
  eval_samples: 2000
  test_samples: 2000

method_args:
  penalty_pf:
    epochs: 7
    warmup_epochs: 0
  penalty_direct:
    epochs: 10

val_set: feasible_validation   # no validation set for this grid yet: test set

test_sets:   # no shifted / oor_load test sets for this grid
  core: [feasible, feasible_high_load_low_der, feasible_low_load_high_der]
  full: [feasible, feasible_high_load_low_der, feasible_low_load_high_der]
