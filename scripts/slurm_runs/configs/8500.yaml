# IEEE 8500-node feeder. Schema: see 13.yaml.

case_dir: 8500_Master
seed: [1, 2, 3]   # one Slurm array task per seed

slurm:
  time: "47:50:00"
  mem: 200G
  partition: pi_donti_gpu,pi_donti_gpu_preemptable,mit_preemptable

args:
  num_layers: 4
  hidden_size: 4096 # old: 2048 but we have much more PVs now
  learning_rate: 5.0e-6
  batch_size: 8
  power_flow_solver: fixed_point
  train_samples: 200000
  eval_samples: 2000
  test_samples: 2000
  cost_scale: 1.0   # training loss uses cost / cost_scale
  # cost_scale: 39.3595 (no validation set yet: p95 of feasible test objective, first 2000 samples)


method_args:
  proposed:
    epochs: 10
    warmup_epochs: 0
  direct_prediction:
    epochs: 10

train_set: training_060_020_020
val_set: feasible_validation   # no validation set for this grid yet: test set

test_sets:   # no oor_load test set for this grid
  core: [feasible, feasible_high_load_low_der, feasible_low_load_high_der]
  full: [feasible, feasible_high_load_low_der, feasible_low_load_high_der,
         feasible_shifted_m01_std01, feasible_shifted_m02_std02, feasible_shifted_m03_std03,
         feasible_shifted_m04_std04, feasible_shifted_m05_std05]
