# Penalty FS regime-weight ablation: W1–W3 suffixed training HDF5 × grids 13/123/240.
#
# W0 baseline (not re-trained): <case>_training.h5 under results/penalty_fs/.
#
# Generate (from repository root):
  # python scripts/slurm_runs/train_jobs.py generate --config scripts/slurm_runs/train_jobs_regime_ablation_penalty_fs.yaml --check-train-h5
# Submit (both resource groups for full grid parallelism):
#   sbatch scripts/slurm_runs/penalty_fs_regime_ablation/submit_small.sh
#   sbatch scripts/slurm_runs/penalty_fs_regime_ablation/submit_medium.sh

name: penalty_fs_regime_ablation

matrix:
  methods: [penalty_fs_rho1e5]
  grids: ["13", "123", "240"]
  seeds: [1]
  train_variants:
    - suffix: "060_005_035"
    - suffix: "060_035_005"
    - suffix: "060_020_020"
    - suffix: "l02_u08"

results_dir: results/penalty_fs_regime_ablation
max_parallel: 20
group_by_resource: true
overwrite: true

env:
  conda_env: new_opt

slurm:
  job_name: train_penalty_fs_regime_ablation
  log_dir: logs/training/regime_ablation_penalty_fs
  default_resource_profile: medium

resources:
  small:
    time: "12:00:00"
    mem: 32G
    cpus_per_task: 4
    gpus: 1
    gpu_type: h200
    partition: pi_donti_gpu,mit_preemptable
  medium:
    time: "24:00:00"
    mem: 64G
    cpus_per_task: 4
    gpus: 1
    gpu_type: h200
    partition: pi_donti_gpu,mit_preemptable
  large:
    time: "47:50:00"
    mem: 200G
    cpus_per_task: 4
    gpus: 1
    gpu_type: h200
    partition: pi_donti_gpu,mit_preemptable,mit_normal_gpu

x-penalty-fs-args: &penalty_fs_args
  include_topo_nn_input: true
  lin_steps: 2
  diff_steps: 0
  fs_maxiter: 100
  fs_tol: 1.0e-6
  fs_rho: 0.0
  save_every: 5
  log_every: 1
  eval_every: 1
  woodbury_ir_steps: "auto"
  woodbury_batch_mode: "vmap"

method_profiles:
  penalty_fs_rho1e5:
    entrypoint: methods/penalty_fs/train.py
    case_suffix: penalty_fs_rho1e5
    ablation_case_token: penalty_fs
    args:
      <<: *penalty_fs_args
      rho: 1.0e5

grid_profiles:
  "13":
    case_dir: IEEE13Nodeckt
    resource_profile: small
    epochs: 10
    num_layers: 4
    learning_rate: 5.0e-5
    batch_size: 32
    hidden_size: 512
    power_flow_solver: fixed_point
    voltage_weight: 8.0
    train_samples: 200000
    eval_samples: 2000
    test_samples: 2000
    val_h5: datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_feasible.h5
    test_variants:
      - datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_feasible.h5
      - datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_infeasible.h5
      - datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_feasible_high_load_low_der.h5
      - datagen_topo/datasets/IEEE13Nodeckt/IEEE13Nodeckt_test_feasible_low_load_high_der.h5

  "123":
    case_dir: IEEE123Master
    resource_profile: small
    epochs: 5
    num_layers: 4
    learning_rate: 5.0e-5
    batch_size: 32
    hidden_size: 1024
    power_flow_solver: fixed_point
    voltage_weight: 8.0
    train_samples: 200000
    eval_samples: 2000
    test_samples: 2000
    val_h5: datagen_topo/datasets/IEEE123Master/IEEE123Master_test_feasible.h5
    test_variants:
      - datagen_topo/datasets/IEEE123Master/IEEE123Master_test_feasible.h5
      - datagen_topo/datasets/IEEE123Master/IEEE123Master_test_infeasible.h5
      - datagen_topo/datasets/IEEE123Master/IEEE123Master_test_feasible_low_load_high_der.h5
      - datagen_topo/datasets/IEEE123Master/IEEE123Master_test_feasible_high_load_low_der.h5

  "240":
    case_dir: 240bus_Master
    resource_profile: medium
    epochs: 5
    num_layers: 4
    learning_rate: 5.0e-5
    batch_size: 32
    hidden_size: 1024
    power_flow_solver: newton_gmres
    voltage_weight: 8.0
    train_samples: 200000
    eval_samples: 2000
    test_samples: 2000
    val_h5: datagen_topo/datasets/240bus_Master/240bus_Master_test_feasible.h5
    test_variants:
      - datagen_topo/datasets/240bus_Master/240bus_Master_test_feasible.h5
      - datagen_topo/datasets/240bus_Master/240bus_Master_test_infeasible.h5
      - datagen_topo/datasets/240bus_Master/240bus_Master_test_feasible_high_load_low_der.h5
      - datagen_topo/datasets/240bus_Master/240bus_Master_test_feasible_low_load_high_der.h5
